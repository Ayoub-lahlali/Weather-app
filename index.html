<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <script type="module" src="script.js" defer></script>
    <title>Document</title>
</head>
<body>
    
<div class="container">

    <div class="searchBox">
        <i class="fa-solid fa-location-dot" style="color: rgb(0, 0, 0);"></i>
        <input id="searchInput" type="text" placeholder="Enter your location">
        <i id="searchBtn" class="fa-solid fa-magnifying-glass" style="color: #000000;"></i>
    </div>

    <div class="notFound hide">
        <p>Sorry, this location not found /:</p>
        <img src="img/404.png" >
    </div>

    <div class="weatherPart hide">
        <img id="mainImg" src="" >
        <p class="Temperature "></p>
        <p class="description"></p>

        <div class="weatherInfo">
            <div class="humidity">
                <i class="fa-solid fa-droplet" style="color: rgb(0, 0, 0);"></i>
                <div class="info">
                    <span id="humi"></span>
                    <p>Humidity</p>
                </div>
            </div>
            <div class="windSpeed">
                <i class="fa-solid fa-wind" style="color: rgb(0, 0, 0);"></i>
                <div class="info">
                    <span id="wind"></span>
                    <p>Wind Speed</p>
                </div>
            </div>
        </div>
        

    </div>
    
</div>

</body>
</html>
